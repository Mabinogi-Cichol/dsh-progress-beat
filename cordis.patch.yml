# dsh-progress-beat bundle patch：向 profile 插入插件配置项。
# inject 声明 systemPrompt 服务依赖：cordis 会等待服务就绪后再 apply，
# 避免 section 注册在服务未就绪时被静默降级（注入失效）。
#
# 配置按三个机制分组，与控制面板的三个折叠组一一对应；
# 省略的字段走 Config schema 的默认值。
- insert:
    - id: dsh-progress-beat
      name: 'dsh-progress-beat'
      inject: [systemPrompt]
      config:
        # ① 常驻进度规则（system prompt section）
        injectPrompt: true
        # 规则文本里「每累计约 N 次工具调用」的 N（只影响过程播报，开局门槛不跟它走）
        promptEvery: 6
        # section 排序号：人设 0，其它插件指令 2，工具声明 100 起
        sectionOrder: 4
        # ② 用户轮提醒（agent/pre-step）
        nudgeOnUserTurn: false
        # ③ 沉默提醒（agent/pre-step）：按「自上次播报以来」的沉默判定（默认开）
        nudgeOnToolCalls: true
        # 沉默调用阈值：累计这么多次工具调用没播报就提醒
        every: 8
        # 沉默时间阈值（秒）：与调用次数先到先算
        silentSeconds: 180
        # 每轮提醒预算；0 表示关掉这一路
        maxRemindersPerTurn: 6
        # 两条提醒之间的最小间隔（秒）
        minGapSeconds: 60
        # 预算用尽后的慢速提醒间隔（秒），不会彻底静音
        dripSeconds: 300
